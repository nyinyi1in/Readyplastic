<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ready Packaging - Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF Download Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#0A5C36', secondary: '#FCD34D' } } } }
  </script>
  <style>
    .out-of-stock-overlay { background: rgba(255,255,255,0.7); position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 10; }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Navbar -->
  <nav class="bg-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="font-black text-primary text-xl flex items-center gap-4">
        <span>READY <span class="text-xs font-bold text-gray-500 block">PACKAGING</span></span>
        <!-- Navigation Links -->
        <button onclick="switchTab('shop')" class="text-sm px-3 py-1 bg-gray-100 rounded hover:bg-gray-200">Shop</button>
        <button onclick="switchTab('track')" class="text-sm px-3 py-1 bg-gray-100 rounded hover:bg-gray-200">Track Order</button>
      </div>
      <button onclick="toggleCart()" class="relative text-primary p-2">
        🛒 <span id="cart-count" class="absolute top-0 right-0 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center">0</span>
      </button>
    </div>
  </nav>

  <!-- Shop Section -->
  <main id="shop-section" class="max-w-7xl mx-auto px-4 py-6 block">
    <div class="mb-6">
      <input type="text" id="search-box" onkeyup="filterProducts()" placeholder="🔍 ပစ္စည်းအမည် (သို့) ကုဒ်ရှာရန်" class="w-full md:w-1/2 p-3 rounded-lg border border-gray-300 focus:outline-primary mb-3">
      <div id="category-filters" class="flex gap-2 overflow-x-auto pb-2"></div>
    </div>
    <div id="loading" class="text-center py-10 text-gray-500">ပစ္စည်းများ ဆွဲယူနေပါသည်...</div>
    <div id="products-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 relative"></div>
  </main>

  <!-- Track Order Section -->
  <main id="track-section" class="max-w-2xl mx-auto px-4 py-10 hidden">
    <div class="bg-white p-6 rounded-lg shadow-md text-center">
      <h2 class="text-xl font-bold text-primary mb-4">အော်ဒါ အခြေအနေ စစ်ဆေးရန်</h2>
      <input type="text" id="track-id" placeholder="Order ID (e.g., ORD-12345)" class="w-full p-3 border rounded-lg mb-4 text-center">
      <button onclick="trackOrder()" class="bg-primary text-white px-6 py-2 rounded-lg font-bold">စစ်ဆေးမည်</button>
      <div id="track-result" class="mt-6 p-4 rounded bg-gray-50 hidden text-lg font-bold"></div>
    </div>
  </main>

  <!-- Cart Modal -->
  <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-end">
    <div class="bg-white w-full md:w-[400px] h-full flex flex-col">
      <div class="bg-primary text-white p-4 flex justify-between items-center">
        <h3 class="font-bold">ဈေးဝယ်ခြင်းတောင်း</h3>
        <button onclick="toggleCart()" class="text-xl">&times;</button>
      </div>
      <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50"></div>
      
      <!-- Checkout Form -->
      <div class="p-4 bg-white border-t">
        <div class="flex justify-between font-bold mb-3"><span>စုစုပေါင်း:</span><span id="cart-total" class="text-primary">0 Ks</span></div>
        <form onsubmit="submitOrder(event)" class="space-y-3">
          <input type="text" id="cus-name" required placeholder="အမည်" class="w-full border p-2 rounded">
          <input type="tel" id="cus-phone" required placeholder="ဖုန်းနံပါတ်" class="w-full border p-2 rounded">
          <textarea id="cus-address" required placeholder="လိပ်စာ" class="w-full border p-2 rounded"></textarea>
          
          <!-- Payment Selection -->
          <div class="flex gap-4 p-2 bg-gray-50 rounded border">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="payment" value="Prepaid" required checked> ငွေကြိုရှင်း
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="payment" value="COD" required> အိမ်ရောက်ငွေချေ
            </label>
          </div>

          <button type="submit" id="checkout-btn" class="w-full bg-primary text-white py-3 rounded font-bold">အော်ဒါတင်မည်</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Receipt / Invoice Area (Hidden by default, used for print/PDF) -->
  <div id="receipt-area" class="hidden">
    <div id="printContent" style="padding: 20px; font-family: monospace; width: 300px; background: white; color: black;">
      <h2 style="text-align:center; color: #0A5C36; margin:0;">Ready Packaging</h2>
      <p style="text-align:center; font-size:12px; margin:5px 0;">Paid Invoice<br><span id="r-inv">INV: --</span><br><span id="r-date">Date: --</span></p>
      <hr style="border-top:1px dashed #ccc; margin:10px 0;">
      <table style="width: 100%; font-size:12px; text-align:left; border-collapse:collapse;">
        <thead><tr><th>Item</th><th style="text-align:right;">Amt</th></tr></thead>
        <tbody id="r-items"></tbody>
      </table>
      <hr style="border-top:1px dashed #ccc; margin:10px 0;">
      <h3 style="text-align:right; margin:0;">Total: <span id="r-total">0 Ks</span></h3>
      <p style="text-align:center; font-size:12px; margin-top:20px;">Thank You!</p>
    </div>
  </div>

  <!-- Chat Script Placeholder (Tawk.to) -->
 <!--Start of Tawk.to Script-->
<script type="text/javascript">
var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
(function(){

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx4MAAHi-qhEWXTHRxHH5yw3LuszN7OwfeF1JELDf3WPDzWZc7xPELaCZjPZVNSeBuTmg/exec"; 
    let allProducts = [], cart = [], activeCategory = 'All';

    // UI Tab Switch
    function switchTab(tab) {
      document.getElementById('shop-section').style.display = tab === 'shop' ? 'block' : 'none';
      document.getElementById('track-section').style.display = tab === 'track' ? 'block' : 'none';
    }

    // Load Products
    async function loadData() {
      try {
        const res = await fetch(API_URL);
        allProducts = await res.json();
        setupCategories();
        filterProducts();
      } catch (err) {
        document.getElementById('loading').innerText = "Data error.";
      }
    }

    function setupCategories() {
      const cats = ['All', ...new Set(allProducts.map(p => p.category))];
      const div = document.getElementById('category-filters');
      div.innerHTML = cats.map(c => `
        <button onclick="activeCategory='${c}'; filterProducts();" class="px-4 py-1 rounded-full text-sm border whitespace-nowrap ${activeCategory === c ? 'bg-primary text-white' : 'bg-white'}">${c}</button>
      `).join('');
    }

    function filterProducts() {
      setupCategories(); // Refresh buttons
      const keyword = document.getElementById('search-box').value.toLowerCase();
      const filtered = allProducts.filter(p => 
        (activeCategory === 'All' || p.category === activeCategory) &&
        (p.name.toLowerCase().includes(keyword) || p.code.toLowerCase().includes(keyword))
      );
      renderProducts(filtered);
    }

    function renderProducts(products) {
      document.getElementById('loading').style.display = 'none';
      const grid = document.getElementById('products-grid');
      grid.innerHTML = products.map(p => {
        const isOutOfStock = p.stock <= 0;
        return `
          <div class="bg-white rounded border p-2 relative overflow-hidden flex flex-col">
            ${isOutOfStock ? `<div class="out-of-stock-overlay"><span class="bg-red-500 text-white px-2 py-1 text-xs font-bold rounded">Out of Stock</span></div>` : ''}
            <img src="${p.image || 'https://via.placeholder.com/150'}" class="h-24 object-contain mx-auto">
            <div class="mt-2 text-xs text-gray-500">${p.code} | Stock: ${p.stock}</div>
            <div class="font-bold text-sm h-10 line-clamp-2">${p.name}</div>
            <div class="mt-auto flex justify-between items-end">
              <span class="text-primary font-bold">${p.price} Ks</span>
              <button onclick="addToCart('${p.code}')" ${isOutOfStock ? 'disabled' : ''} class="${isOutOfStock ? 'bg-gray-300' : 'bg-secondary text-black'} px-2 py-1 rounded text-xs">Add</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Cart Logic
    function addToCart(code) {
      const p = allProducts.find(x => x.code === code);
      if(p.stock <= 0) return alert("ပစ္စည်းလက်ကျန်မရှိပါ။");
      const ext = cart.find(x => x.code === code);
      if(ext) ext.qty++; else cart.push({...p, qty: 1});
      updateCart();
    }

    function updateCart() {
      document.getElementById('cart-count').innerText = cart.reduce((s, i) => s + i.qty, 0);
      let total = 0;
      document.getElementById('cart-items').innerHTML = cart.map((item, index) => {
        total += item.price * item.qty;
        return `
          <div class="bg-white p-2 rounded border flex justify-between items-center text-sm">
            <div class="flex-1 font-bold">${item.name} <div class="text-xs text-gray-500">${item.price} Ks</div></div>
            <div class="flex items-center gap-2">
              <button onclick="cart[${index}].qty--; if(cart[${index}].qty<=0) cart.splice(${index},1); updateCart();" class="bg-gray-200 px-2 rounded">-</button>
              <span>${item.qty}</span>
              <button onclick="cart[${index}].qty++; updateCart();" class="bg-gray-200 px-2 rounded">+</button>
            </div>
          </div>
        `;
      }).join('');
      document.getElementById('cart-total').innerText = total + " Ks";
    }

    function toggleCart() {
      const modal = document.getElementById('cart-modal');
      modal.classList.toggle('hidden');
    }

    // Order Submission
    async function submitOrder(e) {
      e.preventDefault();
      if(cart.length === 0) return alert("Cart is empty");
      const btn = document.getElementById('checkout-btn');
      btn.innerText = "Processing..."; btn.disabled = true;

      const payload = {
        name: document.getElementById('cus-name').value,
        phone: document.getElementById('cus-phone').value,
        address: document.getElementById('cus-address').value,
        paymentType: document.querySelector('input[name="payment"]:checked').value,
        cart: cart,
        total: cart.reduce((s, i) => s + (i.price * i.qty), 0)
      };

      try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
        const data = await res.json();
        
        if (data.paymentType === 'Prepaid') {
          alert(`✅ အော်ဒါတင်ပြီးပါပြီ (Order: ${data.orderId})။ ဘောင်ချာ (Invoice) ကို ဒေါင်းလုဒ်ဆွဲပေးပါမည်။`);
          generateAndDownloadReceipt(data.orderId, data.dateStr, cart, payload.total);
        } else {
          alert(`✅ အော်ဒါတင်ပြီးပါပြီ (Order: ${data.orderId})။ အိမ်ရောက်ငွေချေစနစ် (COD) ဖြင့် ပို့ဆောင်ပေးပါမည်။`);
        }
        
        cart = []; updateCart(); toggleCart(); e.target.reset();
      } catch (err) { alert("Error occurred."); }
      btn.innerText = "အော်ဒါတင်မည်"; btn.disabled = false;
    }

    // Receipt Generation (Only for Prepaid)
    function generateAndDownloadReceipt(inv, date, items, total) {
      document.getElementById('r-inv').innerText = "INV: " + inv;
      document.getElementById('r-date').innerText = "Date: " + date;
      document.getElementById('r-items').innerHTML = items.map(i => `<tr><td>${i.name}<br><small>${i.price}x${i.qty}</small></td><td style="text-align:right">${i.price * i.qty}</td></tr>`).join('');
      document.getElementById('r-total').innerText = total + " Ks";
      
      const element = document.getElementById('printContent');
      element.parentElement.classList.remove('hidden'); // temporarily show for html2pdf
      html2pdf().set({ margin: 0.1, filename: inv + '.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: [3.15, 6] } }).from(element).save()
      .then(() => { element.parentElement.classList.add('hidden'); });
    }

    // Order Tracking
    async function trackOrder() {
      const id = document.getElementById('track-id').value.trim();
      if(!id) return;
      const res = await fetch(API_URL + "?action=trackOrder&orderId=" + id);
      const data = await res.json();
      const resultDiv = document.getElementById('track-result');
      resultDiv.classList.remove('hidden');
      if(data.status === 'found') {
        let color = data.orderStatus === 'Pending' ? 'text-yellow-600' : (data.orderStatus === 'Cancel' ? 'text-red-600' : 'text-green-600');
        resultDiv.innerHTML = `Order Status: <span class="${color}">${data.orderStatus}</span>`;
      } else {
        resultDiv.innerHTML = `<span class="text-red-600">Order ID ရှာမတွေ့ပါ။</span>`;
      }
    }

    loadData();
  </script>
</body>
</html>
